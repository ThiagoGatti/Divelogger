name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Prepare JAR
        run: cp target/diver-0.0.1-SNAPSHOT.jar application.jar

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: Divelog
          environment_name: Divelog-env
          region: sa-east-1
          version_label: "github-${{ github.sha }}"
          deployment_package: application.jar