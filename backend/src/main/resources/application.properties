spring.application.name=diver

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:diverr}?sslmode=${DB_SSL_MODE:prefer}
spring.datasource.username=${DB_USERNAME:diverr}
spring.datasource.password=${DB_PASSWORD:diverr}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

spring.flyway.enabled=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Atrás do load balancer da AWS (respeita X-Forwarded-Proto/Host)
server.forward-headers-strategy=framework

# Health check para o Elastic Beanstalk: GET /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Primeiro ADMIN (opcional). Veja AdminBootstrap.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Imagens (S3). Sem S3_BUCKET o upload fica desativado (útil no ambiente local).
app.s3.bucket=${S3_BUCKET:}
app.s3.region=${S3_REGION:sa-east-1}
app.s3.max-image-bytes=${S3_MAX_IMAGE_BYTES:8388608}

# Planos (ajuste conforme a definição comercial)
app.plans.free.max-photos-per-log=${PLAN_FREE_MAX_PHOTOS:2}
app.plans.free.max-site-photos=${PLAN_FREE_MAX_SITE_PHOTOS:2}
app.plans.premium.max-photos-per-log=${PLAN_PREMIUM_MAX_PHOTOS:10}

# Limite do corpo das requisições JSON (as imagens vão direto ao S3)
spring.servlet.multipart.enabled=false

# E-mail (recuperação de senha). Configure no Beanstalk: SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD e MAIL_FROM. Sem SPRING_MAIL_HOST nenhum e-mail é enviado.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}
# Só para desenvolvimento: escreve o código de recuperação no log quando o e-mail não está configurado.
app.dev.log-reset-codes=${DEV_LOG_RESET_CODES:false}

# Login com Google: "Web client ID(s)" do Google Cloud, separados por vírgula.
app.google.client-ids=${GOOGLE_CLIENT_IDS:}
